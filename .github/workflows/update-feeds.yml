name: Update teletext news

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    paths:
      - scripts/update-feeds.mjs
      - .github/workflows/update-feeds.yml

permissions:
  contents: write

concurrency:
  group: update-feeds

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/update-feeds.mjs
      - name: Commit new stories
        run: |
          git add data
          if git diff --cached --quiet; then echo "No new stories"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update teletext news"
          git push
